name: Android-App bauen

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Punktschrift Doto laden (SIL Open Font License)
        run: |
          mkdir -p app/src/main/res/font app/src/main/assets/lizenzen
          curl -fsSL -o app/src/main/res/font/doto.ttf "https://github.com/google/fonts/raw/main/ofl/doto/Doto%5BROND,wght%5D.ttf"
          curl -fsSL -o app/src/main/assets/lizenzen/doto_OFL.txt "https://github.com/google/fonts/raw/main/ofl/doto/OFL.txt"

      - name: Glyph Developer Kit von Nothing laden
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/glyph-matrix-sdk-2.0.aar "https://raw.githubusercontent.com/Nothing-Developer-Programme/Glyph-Developer-Kit/main/sdk/glyph-matrix-sdk-2.0.aar"

      - name: whisper.cpp v1.9.5 laden (Spracherkennung am Handy, MIT-Lizenz)
        run: |
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp.git app/whisper.cpp
          mkdir -p app/src/main/assets/lizenzen
          cp app/whisper.cpp/LICENSE app/src/main/assets/lizenzen/whisper.cpp_MIT.txt

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.BRAININGER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret BRAININGER_KEYSTORE_BASE64 fehlt."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/braininger.jks"
          echo "BRAININGER_KEYSTORE=$RUNNER_TEMP/braininger.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        env:
          BRAININGER_KEYSTORE_PASSWORT: ${{ secrets.BRAININGER_KEYSTORE_PASSWORT }}
          BRAININGER_KEY_ALIAS: ${{ secrets.BRAININGER_KEY_ALIAS }}
          BRAININGER_KEY_PASSWORT: ${{ secrets.BRAININGER_KEY_PASSWORT }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Schlüsseldatei entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/braininger.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: braininger-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
