name: Whisper fürs Handy bauen (Prüfung)

on:
  push:
    branches: [pruefung-whisper-handy]
    paths: [".github/workflows/whisper-handy.yml"]

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: whisper.cpp v1.9.5 holen
        run: git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp.git

      - name: Für Android arm64 bauen (CPU, Snapdragon 7s Gen 3 = ARMv9 mit dotprod/i8mm/fp16)
        run: |
          cd whisper.cpp
          for v in neon basis; do
            if [ "$v" = neon ]; then ARCH="-DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+i8mm+fp16"; else ARCH=""; fi
            cmake -B build-$v \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-33 \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
              -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF $ARCH \
              -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF
            cmake --build build-$v -j4 --target whisper-cli whisper-bench
            mkdir -p ../aus/$v
            cp build-$v/bin/whisper-cli build-$v/bin/whisper-bench ../aus/$v/
          done
          cp LICENSE ../aus/LICENSE-whisper.cpp
          file ../aus/*/whisper-cli

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-android-arm64
          path: aus/
          retention-days: 7
