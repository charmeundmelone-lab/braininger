name: Braininger Lite (Kompakt) bauen

on:
  push:
    paths: ["kompakt/**", ".github/workflows/kompakt.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kompakt
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.BRAININGER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret BRAININGER_KEYSTORE_BASE64 fehlt."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/braininger.jks"
          echo "BRAININGER_KEYSTORE=$RUNNER_TEMP/braininger.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        env:
          BRAININGER_KEYSTORE_PASSWORT: ${{ secrets.BRAININGER_KEYSTORE_PASSWORT }}
          BRAININGER_KEY_ALIAS: ${{ secrets.BRAININGER_KEY_ALIAS }}
          BRAININGER_KEY_PASSWORT: ${{ secrets.BRAININGER_KEY_PASSWORT }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Schlüsseldatei entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/braininger.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: braininger-lite-apk
          path: kompakt/app/build/outputs/apk/release/*.apk
          retention-days: 14
